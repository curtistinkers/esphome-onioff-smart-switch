name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build and publish firmware
    uses: esphome/workflows/.github/workflows/build.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6  # 2026.8.1
    with:
      #### Modify below here to match your project ####
      files: |
        onioff-switch-generic.yaml
        onioff-switch-light.yaml
        onioff-switch-fan.yaml
      # Set the ESPHome version
      esphome-version: 2026.7.2
      #### Modify above here to match your project ####
      
      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6  # 2026.8.1
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
