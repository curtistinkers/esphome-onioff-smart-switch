# These substitutions allow the end user to override certain values
substitutions:
  project_version: "1.0.6"
  device_name: "Fan"
  device_type: "fan"
  device_platform: "binary"
  device_icon: "mdi:fan"
  restore_mode: "ALWAYS_OFF"

esphome:
  name: "onioff-switch-fan"
  friendly_name: "ONiOFF Fan Switch"
  project:
    name: curtistinkers.onioff-switch-fan
    version: ${project_version}

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://curtistinkers/esphome-onioff-smart-switch/onioff-switch-fan.yaml@main

packages:
  onioff-base: !include
    file: common/onioff-base.yaml
    vars:
      device_name: ${device_name}
      device_type: ${device_type}
      device_platform: ${device_platform}
      device_icon: ${device_icon}
      restore_mode: ${restore_mode}
