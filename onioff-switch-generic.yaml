# These substitutions allow the end user to override certain values
substitutions:
  restore_mode: "ALWAYS_OFF"

esphome:
  name: "onioff-switch-generic"
  friendly_name: "ONiOFF Generic Switch"
  project:
    name: curtistinkers.onioff-switch-generic
    version: 1.0.3

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://curtistinkers/esphome-onioff-smart-switch/onioff-switch-generic.yaml@main

packages:
  onioff-base: !include
    file: common/onioff-base.yaml
    vars:
      device_name: Switch
      device_type: switch
      device_platform: output
      restore_mode: ${restore_mode}
